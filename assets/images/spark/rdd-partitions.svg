<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" font-family="-apple-system, system-ui, sans-serif">
  <style>
    .bg-rect { fill: #FAF7F2; stroke: #D8CFBC; stroke-width: 1.5; }
    .box { fill: #F5F0E8; stroke: #D8CFBC; stroke-width: 1; }
    .accent { fill: #FFE2D6; stroke: #C15F3C; stroke-width: 1; }
    .label { fill: #2A2925; font-size: 13px; font-weight: 600; }
    .sub-text { fill: #5A554C; font-size: 11px; }
    .accent-text { fill: #C15F3C; font-size: 11px; font-weight: 500; }
    .connector { stroke: #B0AA9C; stroke-width: 1; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #2E2D2A; stroke: #43423E; }
      .box { fill: #34322F; stroke: #43423E; }
      .accent { fill: #4A2D1F; stroke: #D97757; }
      .label { fill: #E8E3D7; }
      .sub-text { fill: #B0AA9C; }
      .accent-text { fill: #D97757; }
      .connector { stroke: #5C5852; }
    }
  </style>

  <text x="290" y="20" text-anchor="middle" class="label">逻辑视图：一个 RDD = 多个 partition</text>

  <rect x="30" y="30" width="520" height="60" rx="8" class="bg-rect"/>
  <text x="48" y="50" class="sub-text" font-style="italic">RDD[T]</text>

  <g text-anchor="middle" class="sub-text">
    <rect x="100" y="50" width="60" height="26" rx="3" class="box"/><text x="130" y="67">P0</text>
    <rect x="170" y="50" width="60" height="26" rx="3" class="box"/><text x="200" y="67">P1</text>
    <rect x="240" y="50" width="60" height="26" rx="3" class="box"/><text x="270" y="67">P2</text>
    <rect x="310" y="50" width="60" height="26" rx="3" class="box"/><text x="340" y="67">P3</text>
    <rect x="380" y="50" width="60" height="26" rx="3" class="box"/><text x="410" y="67">P4</text>
    <rect x="450" y="50" width="60" height="26" rx="3" class="box"/><text x="480" y="67">P5</text>
  </g>

  <g class="connector" stroke-dasharray="3,3">
    <path d="M 130 76 L 130 100 L 120 100 L 120 165"/>
    <path d="M 200 76 L 200 100 L 175 100 L 175 165"/>
    <path d="M 270 76 L 270 165"/>
    <path d="M 340 76 L 340 165"/>
    <path d="M 410 76 L 410 100 L 425 100 L 425 165"/>
    <path d="M 480 76 L 480 100 L 480 165"/>
  </g>

  <text x="290" y="155" text-anchor="middle" class="label">物理视图：partition 调度到 Executor 上并行计算</text>

  <rect x="50" y="170" width="160" height="140" rx="8" class="bg-rect"/>
  <text x="130" y="190" text-anchor="middle" class="sub-text" font-weight="600">Executor 1</text>
  <rect x="75" y="205" width="50" height="24" rx="3" class="accent"/>
  <text x="100" y="221" text-anchor="middle" class="accent-text">P0</text>
  <rect x="135" y="205" width="50" height="24" rx="3" class="accent"/>
  <text x="160" y="221" text-anchor="middle" class="accent-text">P1</text>
  <text x="130" y="288" text-anchor="middle" class="sub-text" font-size="10">node-1.cluster</text>

  <rect x="225" y="170" width="160" height="140" rx="8" class="bg-rect"/>
  <text x="305" y="190" text-anchor="middle" class="sub-text" font-weight="600">Executor 2</text>
  <rect x="250" y="205" width="50" height="24" rx="3" class="accent"/>
  <text x="275" y="221" text-anchor="middle" class="accent-text">P2</text>
  <rect x="310" y="205" width="50" height="24" rx="3" class="accent"/>
  <text x="335" y="221" text-anchor="middle" class="accent-text">P3</text>
  <text x="305" y="288" text-anchor="middle" class="sub-text" font-size="10">node-2.cluster</text>

  <rect x="400" y="170" width="160" height="140" rx="8" class="bg-rect"/>
  <text x="480" y="190" text-anchor="middle" class="sub-text" font-weight="600">Executor 3</text>
  <rect x="425" y="205" width="50" height="24" rx="3" class="accent"/>
  <text x="450" y="221" text-anchor="middle" class="accent-text">P4</text>
  <rect x="485" y="205" width="50" height="24" rx="3" class="accent"/>
  <text x="510" y="221" text-anchor="middle" class="accent-text">P5</text>
  <text x="480" y="288" text-anchor="middle" class="sub-text" font-size="10">node-3.cluster</text>
</svg>
