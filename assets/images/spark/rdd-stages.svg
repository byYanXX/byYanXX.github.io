<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="-apple-system, system-ui, sans-serif">
  <style>
    .stage-box { fill: #FAF7F2; stroke: #D8CFBC; stroke-width: 1.5; }
    .stage-box-accent { fill: #FFF5EC; stroke: #C15F3C; stroke-width: 1.5; }
    .box { fill: #F5F0E8; stroke: #D8CFBC; stroke-width: 1; }
    .accent { fill: #FFE2D6; stroke: #C15F3C; stroke-width: 1; }
    .label { fill: #2A2925; font-size: 13px; font-weight: 600; }
    .stage-label { fill: #5A554C; font-size: 11px; font-weight: 600; }
    .sub-text { fill: #5A554C; font-size: 11px; }
    .accent-text { fill: #C15F3C; font-size: 11px; font-weight: 500; }
    .arrow { stroke: #8E867B; stroke-width: 1.3; fill: none; }
    .arrow-shuffle { stroke: #C15F3C; stroke-width: 1.4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .stage-box { fill: #2E2D2A; stroke: #43423E; }
      .stage-box-accent { fill: #3A2D26; stroke: #D97757; }
      .box { fill: #34322F; stroke: #43423E; }
      .accent { fill: #4A2D1F; stroke: #D97757; }
      .label { fill: #E8E3D7; }
      .stage-label { fill: #B0AA9C; }
      .sub-text { fill: #B0AA9C; }
      .accent-text { fill: #D97757; }
      .arrow { stroke: #807A6F; }
      .arrow-shuffle { stroke: #D97757; }
    }
  </style>
  <defs>
    <marker id="ar1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="#8E867B"/>
    </marker>
    <marker id="ar2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7" fill="#C15F3C"/>
    </marker>
  </defs>

  <text x="290" y="20" text-anchor="middle" class="label">一次 Action 触发 Job，按 Shuffle 切 Stage</text>

  <rect x="20" y="40" width="240" height="180" rx="10" class="stage-box"/>
  <text x="140" y="60" text-anchor="middle" class="stage-label">Stage 1（窄依赖链）</text>

  <text x="60" y="82" class="sub-text">textFile</text>
  <g text-anchor="middle" class="sub-text">
    <rect x="40" y="90" width="40" height="22" rx="3" class="box"/><text x="60" y="106">P0</text>
    <rect x="40" y="120" width="40" height="22" rx="3" class="box"/><text x="60" y="136">P1</text>
    <rect x="40" y="150" width="40" height="22" rx="3" class="box"/><text x="60" y="166">P2</text>
  </g>

  <text x="138" y="82" class="sub-text">filter</text>
  <g text-anchor="middle" class="sub-text">
    <rect x="118" y="90" width="40" height="22" rx="3" class="box"/><text x="138" y="106">P0</text>
    <rect x="118" y="120" width="40" height="22" rx="3" class="box"/><text x="138" y="136">P1</text>
    <rect x="118" y="150" width="40" height="22" rx="3" class="box"/><text x="138" y="166">P2</text>
  </g>

  <text x="216" y="82" class="sub-text">map</text>
  <g text-anchor="middle" class="sub-text">
    <rect x="196" y="90" width="40" height="22" rx="3" class="box"/><text x="216" y="106">P0</text>
    <rect x="196" y="120" width="40" height="22" rx="3" class="box"/><text x="216" y="136">P1</text>
    <rect x="196" y="150" width="40" height="22" rx="3" class="box"/><text x="216" y="166">P2</text>
  </g>

  <g class="arrow" marker-end="url(#ar1)">
    <line x1="80" y1="101" x2="116" y2="101"/>
    <line x1="80" y1="131" x2="116" y2="131"/>
    <line x1="80" y1="161" x2="116" y2="161"/>
    <line x1="158" y1="101" x2="194" y2="101"/>
    <line x1="158" y1="131" x2="194" y2="131"/>
    <line x1="158" y1="161" x2="194" y2="161"/>
  </g>

  <text x="140" y="195" text-anchor="middle" class="sub-text" font-style="italic">同 task 内 pipeline</text>

  <text x="290" y="105" text-anchor="middle" class="accent-text" font-size="12" font-weight="600">SHUFFLE</text>
  <text x="290" y="120" text-anchor="middle" class="sub-text" font-size="10">reduceByKey</text>

  <g class="arrow-shuffle" marker-end="url(#ar2)">
    <line x1="240" y1="101" x2="328" y2="120"/>
    <line x1="240" y1="131" x2="328" y2="140"/>
    <line x1="240" y1="161" x2="328" y2="160"/>
  </g>

  <rect x="320" y="40" width="240" height="180" rx="10" class="stage-box-accent"/>
  <text x="440" y="60" text-anchor="middle" class="stage-label">Stage 2（shuffle 之后）</text>

  <text x="370" y="82" class="sub-text">reduceByKey</text>
  <g text-anchor="middle" class="accent-text">
    <rect x="345" y="90" width="50" height="22" rx="3" class="accent"/><text x="370" y="106">K0</text>
    <rect x="345" y="120" width="50" height="22" rx="3" class="accent"/><text x="370" y="136">K1</text>
    <rect x="345" y="150" width="50" height="22" rx="3" class="accent"/><text x="370" y="166">K2</text>
  </g>

  <text x="475" y="82" class="sub-text">collect → driver</text>
  <g text-anchor="middle" class="accent-text">
    <rect x="430" y="116" width="100" height="30" rx="4" class="accent"/>
    <text x="480" y="135">Array[(K, V)]</text>
  </g>

  <g class="arrow" marker-end="url(#ar1)">
    <line x1="395" y1="101" x2="428" y2="125"/>
    <line x1="395" y1="131" x2="428" y2="131"/>
    <line x1="395" y1="161" x2="428" y2="137"/>
  </g>

  <text x="440" y="195" text-anchor="middle" class="sub-text" font-style="italic">每 partition 一个 task</text>
</svg>
