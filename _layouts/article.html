---
layout: default
---
<div class="notes-container has-toc">
  {% include kb-sidebar.html collection="articles" %}
  <article class="notes-content">
    <header class="note-header">
      <div class="note-breadcrumb">{{ page.category }} <span>›</span> {{ page.subcategory }}</div>
      <h1>{{ page.title }}</h1>
      {% include tags.html tags=page.tags %}
    </header>
    {{ content }}
  </article>
  <aside class="note-toc" aria-label="文章目录">
    <div class="toc-title">目录</div>
    <ul class="toc-list"></ul>
    <div class="toc-empty">本文无小节</div>
  </aside>
</div>
